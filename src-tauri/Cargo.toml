[package]
name = "murmur"
version = "0.3.1"
description = "Murmur and its editions: a plugin host over Matrix, Seeds and the group's memory"
authors = ["Birdbrain"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "murmur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
# Opens the member's own browser for sign-in: a passkey belongs to a website, not to this window.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The updater is desktop-only — mobile apps update through their app store, so
# the plugin must not be compiled into iOS/Android builds.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
